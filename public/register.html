<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Регистрация | MUUN</title>
    <link rel="icon" type="image/x-icon" href="pic/favicon.png">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
    <link href="css/style.css" rel="stylesheet">
    <link href="css/auth.css" rel="stylesheet">
</head>

<body>
    <header>
        <nav>
            <a href="index.html" class="logo">MUUN</a>
            <div class="nav-links">
                <a href="novinki.html">Новинки</a>
                <a href="catalog.html">Коллекции</a>
                <a href="base.html">База</a>
                <a href="about.html">О бренде</a>
            </div>
            <div class="right-menu">
            </div>
        </nav>
    </header>
    <main class="auth-page">
        <div class="auth-container">
            <h1 class="auth-title">Регистрация</h1>
            <p class="auth-subtitle">Создайте аккаунт для доступа к избранному и корзине</p>
            <div id="error-message" class="error-message" style="display: none;"></div>
            <div id="success-message" class="success-message" style="display: none;"></div>
            <form id="register-form" class="auth-form">
                <div class="form-group">
                    <label for="name">Имя</label>
                    <input type="text" id="name" name="name" placeholder="Анна" required>
                </div>
                <div class="form-group">
                    <label for="email">Email</label>
                    <input type="email" id="email" name="email" placeholder="anna@email.com" required>
                </div>
                <div class="form-group">
                    <label for="password">Пароль</label>
                    <input type="password" id="password" name="password" placeholder="минимум 6 символов" required>
                </div>
                <div class="form-group">
                    <label for="confirm-password">Подтвердите пароль</label>
                    <input type="password" id="confirm-password" name="confirm-password" placeholder="••••••••" required>
                </div>
                <button type="submit" class="btn">Зарегистрироваться</button>
            </form>
            <div class="auth-links">
                <a href="login.html" class="auth-link">Уже есть аккаунт? Войти</a>
            </div>
        </div>
    </main>
    <script src="js/main.js"></script>
</body>
</html>
