<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>База | MUUN</title>
  <link rel="icon" type="image/x-icon" href="pic/favicon.png">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&display=swap" rel="stylesheet">
  <link href="css/style.css" type="text/css" rel="stylesheet">
  <link href="css/base.css" type="text/css" rel="stylesheet">
</head>

<body>
  <header>
    <nav>
      <a href="index.html" class="logo">MUUN</a>
      <div class="nav-links">
        <a href="novinki.html">Новинки</a>
        <a href="catalog.html">Коллекции</a>
        <a href="base.html" class="active">База</a>
        <a href="about.html">О бренде</a>
      </div>
      <div class="right-menu">
      </div>
    </nav>
  </header>
  <main>
    <h1>База MUUN</h1>
    <p class="intro">Вечные вещи, которые остаются с вами годами. Натуральные ткани, спокойные силуэты, нейтральные цвета — основа любого спокойного гардероба.</p>
    <!-- НАЧАЛО: Блок поиска и фильтрации -->
    <div class="catalog-controls">
        <!-- Строка поиска -->
        <div class="search-bar">
            <input type="text" id="search-input" placeholder="Поиск по названию или описанию...">
            <button id="search-btn" class="btn btn-outline">Найти</button>
        </div>

        <!-- Фильтры -->
        <div class="filters">
            <div class="filter-group">
                <label for="price-min">Цена от:</label>
                <input type="number" id="price-min" placeholder="0" min="0" step="1">
            </div>
            <div class="filter-group">
                <label for="price-max">до:</label>
                <input type="number" id="price-max" placeholder="100000" min="0" step="1">
            </div>

            <div class="filter-group">
                <label for="material">Материал:</label>
                <select id="material">
                    <option value="">Все</option>
                    <option value="Хлопок">Хлопок</option>
                    <option value="Лен">Лен</option>
                    <option value="Шерсть">Шерсть</option>
                    <option value="Шелк">Шелк</option>
                </select>
            </div>

            <div class="filter-group">
                <label for="sort-by">Сортировать:</label>
                <select id="sort-by">
                    <option value="created_at">Новинки</option>
                    <option value="price">Цена</option>
                    <option value="name">Название</option>
                </select>
            </div>
            <div class="filter-group">
                <label for="sort-order">Порядок:</label>
                <select id="sort-order">
                    <option value="DESC">По убыванию</option>
                    <option value="ASC">По возрастанию</option>
                </select>
            </div>

            <button id="apply-filters" class="btn">Применить</button>
            <button id="reset-filters" class="btn btn-outline">Сброс</button>
        </div>
    </div>
    <!-- КОНЕЦ: Блок поиска и фильтрации -->
    <div class="basics-grid" id="basics-grid">
        <!-- Товары загрузятся динамически -->
    </div>
  </main>

  <!-- Модальное окно выбора размера -->
  <div id="size-selector-modal" class="modal size-modal" style="display: none;">
      <div class="modal-content size-modal-content">
          <div class="modal-header">
              <h3>Выберите размер</h3>
              <button class="modal-close" onclick="closeSizeSelectorModal()">&times;</button>
          </div>
          <div class="modal-body">
              <div class="size-options-modal" id="modal-size-options">
                  <label class="size-option">
                      <input type="radio" name="modal-size" value="XS">
                      <span>XS</span>
                  </label>
                  <label class="size-option">
                      <input type="radio" name="modal-size" value="S">
                      <span>S</span>
                  </label>
                  <label class="size-option">
                      <input type="radio" name="modal-size" value="M">
                      <span>M</span>
                  </label>
                  <label class="size-option">
                      <input type="radio" name="modal-size" value="L">
                      <span>L</span>
                  </label>
                  <label class="size-option">
                      <input type="radio" name="modal-size" value="XL">
                      <span>XL</span>
                  </label>
              </div>
              <button class="btn btn-full confirm-size-btn" onclick="confirmAddToCart()">Добавить в корзину</button>
          </div>
      </div>
  </div>

  <script src="js/main.js"></script>
</body>
</html>
